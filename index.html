<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Website</title>
</head>
<link rel="stylesheet" href="styles.css" type="text/css">
<body>
    <h1>A Sample form</h1>
    <form action = # method="post">
        Name<input type="text" name="name"><br>
        Reg No<input type="text" name="regno"><br>
        Course<input type="text" name="course"><br><br>
        <input type="radio" name="year" value="1"> Year 1
        <input type="radio" name="year" value="2"> Year 2
        <input type="radio" name="year" value="3"> Year 3
        <input type="radio" name="year" value="4"> Year 4<br><br>
        <input type="checkbox" name="dip">Diploma
        <input type="checkbox" name="deg">Degree
        <input type="checkbox" name="mas">Masters<br><br>
        <select>
            <option>Web Development</option>
            <option>Networking</option>
            <option>Calculus</option>
            <option>Design Thinking</option>
            <option>Data Science</option>
        </select><br><br><br>
        Remarks:<br>
        <textarea name="Remarks" cols="20" rows="10"></textarea><br><br>
        <input type="Submit" name="Send" Value="SEND">
        <input type="Submit" name="Cancel" value="CANCEL">
    </form>   
</body>
</html>
